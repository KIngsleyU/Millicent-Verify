<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Compute slope</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 12px;
        width: 260px;
      }
      label {
        display: block;
        margin-top: 6px;
      }
      input {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        padding: 8px;
        width: 100%;
        cursor: pointer;
      }
      #result {
        margin-top: 10px;
        font-weight: bold;
      }
      #error {
        margin-top: 10px;
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h3>Enter 3 numbers (y values)</h3>
    <form id="slope-form">
      <label>y₁ <input type="number" step="any" id="y1" required /></label>
      <label>y₂ <input type="number" step="any" id="y2" required /></label>
      <label>y₃ <input type="number" step="any" id="y3" required /></label>
      <button type="submit">Compute slope</button>
    </form>
    <div id="result"></div>
    <div id="error"></div>

    <script src="popup.js"></script>
  </body>
</html>
